<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>

   <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎨 Color Changer</h1>

        <div class="box">
            <div class="button" id="blue">BLUE</div>
            <div class="button" id="green">GREEN</div>
            <div class="button" id="yellow">YELLOW</div>
            <div class="button" id="pink">PINK</div>
        </div>

        <p>👆 Try clicking one of the colors above to change the background color of the page.</p>

    </div>
<script src="script.js"></script>
</body>

</html>
